name: Build and gate Tortoise Crew Windows Launcher
on:
  pull_request:
    branches: [main]
    paths: ['tortoise-crew/**', '.github/workflows/build-tortoise-crew.yml']
  push:
    branches: [main, 'fix/crew-v1.0.9']
    paths: ['tortoise-crew/**', '.github/workflows/build-tortoise-crew.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tortoise-crew-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile launcher and regression suites
        shell: pwsh
        run: ./tortoise-crew/scripts/Build.ps1
      - name: Run update and addon regression suites
        shell: pwsh
        run: ./tortoise-crew/scripts/Test.ps1
      - name: Test real desktop shortcut on the disposable runner
        shell: pwsh
        run: ./tortoise-crew/scripts/Test-DesktopLaunch.ps1
      - name: Prove unsigned builds cannot change the public release
        shell: pwsh
        run: |
          $beforeExe = (Get-FileHash tortoise-crew/TortoiseCrewLauncher.exe).Hash
          $beforeManifest = (Get-FileHash tortoise-crew/manifest.json).Hash
          $blocked = $false
          try { ./tortoise-crew/scripts/Prepare-Release.ps1 -Executable out/TortoiseCrewLauncher.exe }
          catch {
            if ($_.Exception.Message -notlike 'Release blocked: Windows-trusted*') { throw }
            $blocked = $true
          }
          if (-not $blocked) { throw 'Unsigned build passed the publication gate.' }
          if ($beforeExe -ne (Get-FileHash tortoise-crew/TortoiseCrewLauncher.exe).Hash -or
              $beforeManifest -ne (Get-FileHash tortoise-crew/manifest.json).Hash) {
            throw 'Failed release modified public distribution files.'
          }
      - name: Upload build for signing (UNSIGNED - do not install)
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: TortoiseCrewLauncher-v1.0.9-UNSIGNED-DO-NOT-INSTALL
          path: out/TortoiseCrewLauncher.exe
          retention-days: 7
      - name: Sign through the configured trusted publisher
        id: sign
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          vars.SIGNPATH_ORGANIZATION_ID != '' &&
          vars.SIGNPATH_PROJECT_SLUG != '' &&
          vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Verify signed release before changing manifest
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: ./tortoise-crew/scripts/Prepare-Release.ps1 -Executable signed/TortoiseCrewLauncher.exe
      - name: Publish signed EXE and matching manifest together
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tortoise-crew/TortoiseCrewLauncher.exe tortoise-crew/manifest.json
          if (git diff --cached --name-only) {
            git commit -m 'Publish Windows-trusted Tortoise Crew Launcher v1.0.9'
            if ($LASTEXITCODE -ne 0) { throw 'Release commit failed.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Release push failed; no force push attempted.' }
          }
      - name: Report release state
        shell: pwsh
        env:
          SIGNING_OUTCOME: ${{ steps.sign.outcome }}
        run: |
          if ($env:SIGNING_OUTCOME -eq 'success') {
            'Signed v1.0.9 was published with its SHA-256 manifest.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            $public = Get-Content tortoise-crew/manifest.json -Raw | ConvertFrom-Json
            if (-not $public.updatesPaused -and $public.launcherVersion -eq '1.0.9') {
              "Public v1.0.9 is available ($($public.releaseSignature)). This CI build was tested but was not substituted for the published artifact." >> $env:GITHUB_STEP_SUMMARY
            } else {
              'v1.0.9 source compiled and passed tests. This unsigned CI artifact was not published; the public release manifest was preserved.' >> $env:GITHUB_STEP_SUMMARY
            }
          }
