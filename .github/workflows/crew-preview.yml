name: Tortoise Crew source preview (unsigned)
on:
  push:
    branches: [feature/crew-v1.0.8]
    paths: ['tortoise-crew/src/**', '.github/workflows/crew-preview.yml']
  pull_request:
    paths: ['tortoise-crew/src/**', 'tortoise-crew/scripts/**']
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile source and tests without publishing an installer
        shell: pwsh
        run: ./tortoise-crew/scripts/Build.ps1
